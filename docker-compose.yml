services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PORT=3000
      - EVE_NEXT_PRODUCTION_PORT=4274
      - AUTH_TRUST_HOST=true
      - NEXOROUTER_API_KEY=${NEXOROUTER_API_KEY}
      - NEXOROUTER_MODEL=${NEXOROUTER_MODEL:-kimi-k2.6}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-https://agente-estadistica-i.srv1825081.hstgr.cloud}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - TEACHER_EMAILS=${TEACHER_EMAILS:-}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-est.umss.edu}
      - AULA_DB_PATH=/app/.eve/.workflow-data/aula.sqlite
    volumes:
      - eve_workflow:/app/.eve/.workflow-data
    labels:
      - traefik.enable=true
      - traefik.http.routers.agente-estadistica-i.rule=Host(`agente-estadistica-i.srv1825081.hstgr.cloud`)
      - traefik.http.routers.agente-estadistica-i.entrypoints=websecure
      - traefik.http.routers.agente-estadistica-i.tls.certresolver=letsencrypt
      - traefik.http.services.agente-estadistica-i.loadbalancer.server.port=3000

volumes:
  eve_workflow:
